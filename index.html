<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<meta name="color-scheme" content="light">
<meta name="description" content="Clock, stopwatch, timer and a calendar with reminders up to 2099.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MHS Date &amp; Time</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --orange:#ea580c; --orange-d:#c2410c; --tint:#fff1e8; --ink:#1d1d1f; --soft:#6b7280;
  --line:#e8eaee; --bg:#f5f6f8; --card:#ffffff; --hol:#d8ecff; --holtext:#1c4f82; --bad:#c62828;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(20,20,40,.06);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none; touch-action:pan-x pan-y}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; line-height:1.35; -webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text; user-select:text; font:inherit; color:inherit}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
:focus-visible{outline:3px solid var(--orange); outline-offset:2px}
[hidden]{display:none!important}

/* ===== app shell: always exactly the size of the screen, nothing scrolls ===== */
.app{position:fixed; inset:0; margin:auto; max-width:560px; display:flex; flex-direction:column; background:var(--bg)}
.top{flex:none; display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.logo{background:var(--orange); color:#fff; font-weight:800; font-size:.78rem; letter-spacing:.06em; padding:6px 10px; border-radius:10px}
h1{font-size:1.2rem; margin:0; font-weight:800}
h2{font-size:1rem; margin:0}
.main{flex:1; min-height:0; position:relative}
.view{position:absolute; inset:0; padding:2px 14px 10px; display:flex; flex-direction:column; gap:10px;
  overflow-y:auto; overflow-x:hidden; touch-action:pan-y; scrollbar-width:none; animation:in .2s ease}
.view::-webkit-scrollbar{display:none}
@keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.scr{touch-action:pan-y; scrollbar-width:thin}

.card{background:var(--card); border-radius:18px; padding:14px; box-shadow:var(--shadow)}
.btn{border:0; background:var(--orange-d); color:#fff; font-weight:700; padding:10px 16px; border-radius:12px; min-height:46px}
.btn.ghost{background:var(--tint); color:var(--orange-d)}
.btn.danger{background:#fdeaea; color:var(--bad)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.row{display:flex; gap:10px; align-items:center}
.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.hint{color:var(--soft); font-size:.78rem; margin:0; text-align:center}

/* clock */
.cc{flex:1 1 0; min-height:0; display:flex; flex-direction:column; justify-content:center}
.hero{background:linear-gradient(135deg,#ea580c,#c2410c); color:#fff}
.lbl{font-size:.75rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; opacity:.85; margin-bottom:6px}
.lbl.dark{color:var(--soft); opacity:1}
.big{font-variant-numeric:tabular-nums; font-weight:800; letter-spacing:-.02em; line-height:1.05;
  font-size:clamp(2rem,min(11.5vw,7.2vh),3.8rem); font-size:clamp(2rem,min(11.5vw,7.2dvh),3.8rem)}
.ampm{font-size:.4em; font-weight:800; color:var(--orange-d); letter-spacing:.04em; margin-left:6px}
.dateline{color:var(--soft); margin-top:6px; font-weight:600; font-size:.9rem}
.adjcard{flex:none}
.adjhead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px}
.pill{font-size:.7rem; font-weight:800; background:var(--tint); color:var(--orange-d); padding:4px 10px; border-radius:99px}
.adj{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px}
.adj input{width:66px; height:48px; font-size:1.35rem; font-weight:700; text-align:center; border:2px solid var(--line); border-radius:12px; background:#fff; padding:0}
.colon{font-size:1.5rem; font-weight:800}
.seg{display:inline-flex; background:var(--tint); border-radius:12px; padding:4px; margin-left:4px}
.seg button{border:0; background:transparent; font-weight:800; padding:11px 14px; border-radius:9px; color:var(--orange-d)}
.seg button[aria-pressed="true"]{background:var(--orange-d); color:#fff}

/* stopwatch */
.swcard{flex:1; min-height:0; display:flex; flex-direction:column}
.disp{flex:none; text-align:center; padding:8px 0 16px}
.disp .big{font-size:clamp(2.6rem,min(14vw,10vh),4.6rem); font-size:clamp(2.6rem,min(14vw,10dvh),4.6rem)}
.cs{font-size:.5em; color:var(--soft); font-weight:700}
.ctl{flex:none; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ctl .btn{min-height:54px; font-size:1.02rem}
.laps{flex:1; min-height:0; overflow-y:auto; list-style:none; margin:10px 0 0; padding:0}
.laps li{display:flex; justify-content:space-between; gap:8px; padding:9px 4px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; font-size:.92rem}
.laps b{color:var(--orange-d)} .laps span{color:var(--soft)}

/* timer */
.tmcard{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px}
.chips{flex:none; display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.chip{border:2px solid var(--line); background:#fff; border-radius:999px; padding:0 4px; font-weight:800; min-height:44px; font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--orange-d); border-color:var(--orange-d); color:#fff}
.custom{flex:none; display:flex; gap:8px; justify-content:center; align-items:center}
.custom input{width:110px; height:44px; padding:0 10px; border:2px solid var(--line); border-radius:12px; text-align:center; font-weight:700; background:#fff}
.custom .btn{min-height:44px}
.ringwrap{flex:1 1 0; min-height:0; display:flex; align-items:center; justify-content:center; container-type:size}
.ring{position:relative; width:min(60vw,200px); height:min(60vw,200px);
  width:min(100cqw,100cqh,280px); height:min(100cqw,100cqh,280px); container-type:size}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring .track{fill:none; stroke:var(--line); stroke-width:10}
.ring .prog{fill:none; stroke:var(--orange); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .25s linear}
.ring .mid{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .big{font-size:clamp(1.8rem,9vw,3rem); font-size:20cqw}
.ring .big.long{font-size:14.5cqw}
.up{flex:none; color:var(--bad); font-weight:800; text-align:center; min-height:1.3em}

/* calendar */
.search{flex:none; position:relative}
.search input{width:100%; height:46px; padding:0 14px; border:2px solid var(--line); border-radius:14px; background:#fff}
.results{position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:15; max-height:min(46vh,300px); max-height:min(46dvh,300px); overflow-y:auto;
  background:#fff; border-radius:14px; box-shadow:0 12px 36px rgba(20,20,40,.2); list-style:none; margin:0; padding:4px 12px}
.results li button{width:100%; text-align:left; background:transparent; border:0; border-top:1px solid var(--line); padding:10px 2px; display:flex; flex-direction:column}
.results li:first-child button{border-top:0}
.results .rd{font-weight:800; color:var(--orange-d); font-size:.88rem}
.results .rt{color:var(--soft); overflow-wrap:anywhere; font-size:.9rem}
.results .none{padding:12px 2px; color:var(--soft)}
.calcard{flex:1 1 0; min-height:0; display:flex; flex-direction:column; padding:10px}
.calhead{flex:none; display:flex; gap:6px; margin-bottom:8px}
.calhead .btn{min-width:42px; min-height:42px; padding:0 10px}
.calhead select{height:42px; min-width:0; padding:0 8px; border:2px solid var(--line); border-radius:12px; background:#fff; font-weight:700}
#cMonth{flex:1} #cYear{width:98px}
.dow{flex:none; display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px}
.dow div{text-align:center; font-size:.72rem; font-weight:800; color:var(--soft)}
.dow .h{color:var(--holtext)}
.days{flex:1 1 0; min-height:0; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:repeat(6,minmax(0,1fr)); gap:3px}
.d{container-type:size; position:relative; min-width:0; min-height:0; border:0; background:#f8f9fb; border-radius:10px; display:flex; align-items:center; justify-content:center; padding:0; font-weight:700}
.d.hol{background:var(--hol); color:var(--holtext)}
.d .n{width:28px; height:28px; width:min(40px,80cqmin); height:min(40px,80cqmin); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.95rem}
.d.today .n{background:var(--orange); color:#fff; font-weight:800}
.d.sel{box-shadow:inset 0 0 0 2.5px var(--orange-d)}
.d.note::after{content:""; position:absolute; bottom:3px; width:5px; height:5px; border-radius:50%; background:var(--orange-d)}
.d.today.note::after{background:#fff; bottom:6px}
.calfoot{flex:none; display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px}
.legend{display:flex; gap:10px; font-size:.72rem; color:var(--soft); align-items:center; flex-wrap:wrap}
.legend i{display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:4px; vertical-align:-1px}
.todaybtn{min-height:36px; padding:6px 14px; font-size:.85rem}
.daybar{flex:none; display:flex; align-items:center; gap:12px; padding:10px 12px}
.dbtxt{flex:1; min-width:0}
.dptitle{font-weight:800; font-size:.95rem}
.dpnote{margin:2px 0 0; font-size:.88rem; max-height:3.9em; overflow-y:auto; white-space:pre-wrap; overflow-wrap:anywhere}
.dpnote.empty{color:var(--soft)}
textarea{width:100%; padding:12px; border:2px solid var(--line); border-radius:12px; background:#fff; resize:none; margin:10px 0 12px}

/* nav + toast + modal */
nav{flex:none; background:#fff; border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex; gap:4px}
nav button{flex:1; border:0; background:transparent; padding:7px 2px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:.72rem; font-weight:700; color:var(--soft)}
nav button[aria-selected="true"]{background:var(--tint); color:var(--orange-d)}
nav svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 18px; border-radius:12px; font-weight:700; z-index:70; max-width:calc(100% - 28px); text-align:center}
.modal{position:fixed; inset:0; background:rgba(15,15,30,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
.modal.top{align-items:flex-start; padding-top:calc(16px + env(safe-area-inset-top))}
#modal{z-index:60}
.sheet{background:#fff; border-radius:18px; padding:18px; max-width:380px; width:100%}
.sheet p{margin:0; font-weight:700}
.sheet .row{justify-content:flex-end; flex-wrap:wrap}
.edtitle{font-weight:800}

@media (hover:hover){
  .btn:hover:not(:disabled){filter:brightness(1.07)}
  nav button:hover{background:#faf3ee}
  .chip:hover,.d:hover{filter:brightness(.96)}
}
@media (min-width:700px){
  body{background:linear-gradient(135deg,#ffe3d1,#eef1f6)}
  .app{height:min(100%,880px); border-radius:28px; overflow:hidden; box-shadow:0 24px 70px rgba(60,25,0,.2)}
}
@media (max-height:620px){ .hint,.legend span:nth-child(n+2){display:none} .lbl{margin-bottom:2px} .cc{padding-top:10px;padding-bottom:10px} }
@media (max-width:360px){ .adj input{width:58px} .seg button{padding:11px 11px} #cYear{width:92px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><span class="logo">MHS</span><h1>Date &amp; Time</h1></header>

  <main class="main">
    <!-- CLOCK -->
    <section class="view" id="tab-clock">
      <div class="card cc hero">
        <div class="lbl">24-hour clock</div>
        <div class="big" id="c24">00:00:00</div>
      </div>
      <div class="card cc">
        <div class="lbl dark">12-hour clock</div>
        <div class="big"><span id="c12">12:00:00</span><span class="ampm" id="cap">AM</span></div>
        <div class="dateline" id="clockDate"></div>
      </div>
      <div class="card adjcard">
        <div class="adjhead"><h2>Adjust time</h2><span class="pill" id="adjNote">Phone time</span></div>
        <div class="adj">
          <input id="aH" type="number" inputmode="numeric" min="1" max="12" placeholder="HH" aria-label="Hour">
          <span class="colon">:</span>
          <input id="aM" type="number" inputmode="numeric" min="0" max="59" placeholder="MM" aria-label="Minute">
          <div class="seg" id="aAP" role="group" aria-label="AM or PM">
            <button data-ap="AM" aria-pressed="true">AM</button>
            <button data-ap="PM" aria-pressed="false">PM</button>
          </div>
        </div>
        <div class="two">
          <button class="btn" id="setTime">Set time</button>
          <button class="btn ghost" id="resetTime">Phone time</button>
        </div>
      </div>
    </section>

    <!-- STOPWATCH -->
    <section class="view" id="tab-stopwatch" hidden>
      <div class="card swcard">
        <div class="disp"><div class="big"><span id="swMain">00:00</span><span class="cs" id="swCs">.00</span></div></div>
        <div class="ctl">
          <button class="btn" id="swStart">Start</button>
          <button class="btn" id="swStop">Stop</button>
          <button class="btn ghost" id="swLap">Lap</button>
          <button class="btn ghost" id="swReset">Reset</button>
        </div>
        <ul class="laps scr" id="laps"></ul>
      </div>
    </section>

    <!-- TIMER -->
    <section class="view" id="tab-timer" hidden>
      <div class="card tmcard">
        <div class="chips" id="chips">
          <button class="chip" data-min="1" aria-pressed="false">1 min</button>
          <button class="chip" data-min="3" aria-pressed="false">3 min</button>
          <button class="chip" data-min="5" aria-pressed="true">5 min</button>
          <button class="chip" data-min="10" aria-pressed="false">10 min</button>
        </div>
        <div class="custom">
          <input id="tmCustom" type="number" inputmode="numeric" min="1" max="600" placeholder="Minutes" aria-label="Custom minutes">
          <button class="btn ghost" id="tmSetCustom">Set</button>
        </div>
        <div class="ringwrap">
          <div class="ring">
            <svg viewBox="0 0 240 240" aria-hidden="true"><circle class="track" cx="120" cy="120" r="108"/><circle class="prog" id="prog" cx="120" cy="120" r="108"/></svg>
            <div class="mid"><div class="big" id="tmText">5:00</div></div>
          </div>
        </div>
        <div class="up" id="tmUp"></div>
        <div class="two">
          <button class="btn" id="tmGo">Start</button>
          <button class="btn ghost" id="tmReset">Reset</button>
        </div>
        <p class="hint">Keep the app open so the alarm can sound.</p>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="view" id="tab-calendar" hidden>
      <div class="search">
        <input id="q" type="search" placeholder="Search your reminders…" aria-label="Search reminders" autocomplete="off">
        <ul class="results scr" id="results" hidden></ul>
      </div>
      <div class="card calcard" id="calCard">
        <div class="calhead">
          <button class="btn ghost" id="cPrev" aria-label="Previous month">‹</button>
          <select id="cMonth" aria-label="Month"></select>
          <select id="cYear" aria-label="Year"></select>
          <button class="btn ghost" id="cNext" aria-label="Next month">›</button>
        </div>
        <div class="dow" id="dow"></div>
        <div class="days" id="days"></div>
        <div class="calfoot">
          <div class="legend">
            <span><i style="background:var(--orange)"></i>Today</span>
            <span><i style="background:var(--hol)"></i>Holiday</span>
            <span><i style="background:var(--orange-d);width:6px;height:6px;vertical-align:2px"></i>Reminder</span>
          </div>
          <button class="btn ghost todaybtn" id="cToday">Today</button>
        </div>
      </div>
      <div class="card daybar" id="dayPanel">
        <div class="dbtxt">
          <div class="dptitle" id="dpTitle"></div>
          <p class="dpnote scr" id="dpNote"></p>
        </div>
        <button class="btn" id="dpEdit">Edit</button>
      </div>
    </section>
  </main>

  <nav aria-label="Main">
    <div class="in" role="tablist">
      <button role="tab" aria-selected="true" data-tab="clock"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Clock</button>
      <button role="tab" aria-selected="false" data-tab="stopwatch"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 1M9 2h6M12 2v3"/></svg>Stopwatch</button>
      <button role="tab" aria-selected="false" data-tab="timer"><svg viewBox="0 0 24 24"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></svg>Timer</button>
      <button role="tab" aria-selected="false" data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    </div>
  </nav>
</div>

<!-- reminder editor -->
<div class="modal top" id="editModal" hidden role="dialog" aria-modal="true" aria-labelledby="edTitle">
  <div class="sheet">
    <div class="edtitle" id="edTitle"></div>
    <textarea id="dpText" rows="4" maxlength="500" placeholder="Write your reminder…" aria-label="Reminder"></textarea>
    <div class="row">
      <button class="btn danger" id="dpDel">Delete</button>
      <button class="btn ghost" id="dpCancel">Cancel</button>
      <button class="btn" id="dpSave">Save</button>
    </div>
  </div>
</div>
<!-- confirm -->
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalMsg">
  <div class="sheet">
    <p id="modalMsg" style="margin-bottom:16px"></p>
    <div class="row"><button class="btn ghost" id="mNo">Cancel</button><button class="btn danger" id="mYes">OK</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const p2 = n => String(n).padStart(2,'0');
const setT = (el,v) => { if(el._v!==v){ el._v=v; el.textContent=v } };

/* ===== no zooming: pinch, ctrl+wheel (keyboard zoom on PC still works for accessibility) ===== */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault() },{passive:false});
document.addEventListener('wheel',e=>{ if(e.ctrlKey) e.preventDefault() },{passive:false});

/* ===== storage ===== */
const LS = 'mhsDateTimeV1';
let store = {offset:0, notes:{}};
try { Object.assign(store, JSON.parse(localStorage.getItem(LS)) || {}) } catch(e){}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)) }catch(e){} }

/* ===== toast + confirm ===== */
let toastTimer;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.hidden=true,2800) }
function ask(msg,label){
  return new Promise(res=>{
    const m=$('modal'); $('modalMsg').textContent=msg; $('mYes').textContent=label||'OK'; m.hidden=false; $('mNo').focus();
    const done=v=>{ m.hidden=true; $('mYes').onclick=null; $('mNo').onclick=null; m.onclick=null; res(v) };
    $('mYes').onclick=()=>done(true); $('mNo').onclick=()=>done(false);
    m.onclick=e=>{ if(e.target===m) done(false) };
  });
}

/* ===== CLOCK ===== */
const nowAdj = () => new Date(Date.now() + (store.offset||0));
let dayShown='';
function tickClock(){
  if(document.hidden) return;
  const d=nowAdj(), h=d.getHours(), m=d.getMinutes(), s=d.getSeconds();
  setT($('c24'), p2(h)+':'+p2(m)+':'+p2(s));
  setT($('c12'), (h%12||12)+':'+p2(m)+':'+p2(s));
  setT($('cap'), h<12 ? 'AM' : 'PM');
  const ds=d.toDateString();
  if(ds!==dayShown){ dayShown=ds; $('clockDate').textContent = d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) }
}
let ap='AM';
function setAP(v){ ap=v; document.querySelectorAll('#aAP button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.ap===v)) }
document.querySelectorAll('#aAP button').forEach(b=>b.onclick=()=>setAP(b.dataset.ap));
function fillAdjust(){
  const d=nowAdj(); $('aH').value=d.getHours()%12||12; $('aM').value=p2(d.getMinutes()); setAP(d.getHours()<12?'AM':'PM');
  $('adjNote').textContent = store.offset ? 'Custom time' : 'Phone time';
}
$('setTime').onclick=()=>{
  const h=parseInt($('aH').value), m=parseInt($('aM').value);
  if(!(h>=1&&h<=12)){ toast('Hour must be 1 to 12.'); return }
  if(!(m>=0&&m<=59)){ toast('Minute must be 0 to 59.'); return }
  const t=new Date(); t.setHours((h%12)+(ap==='PM'?12:0), m, 0, 0);
  store.offset = t.getTime()-Date.now(); save(); tickClock(); fillAdjust(); toast('Time set.');
};
$('resetTime').onclick=()=>{ store.offset=0; save(); tickClock(); fillAdjust(); toast('Using phone time.') };
setInterval(tickClock,250);

/* ===== STOPWATCH ===== */
const sw={run:false,start:0,base:0,laps:[],raf:0};
const swNow=()=>sw.base+(sw.run?Date.now()-sw.start:0);
function fmtSw(ms){
  const cs=Math.floor(ms/10)%100, t=Math.floor(ms/1000), s=t%60, m=Math.floor(t/60)%60, h=Math.floor(t/3600);
  return {main:(h?h+':'+p2(m):p2(m))+':'+p2(s), cs:'.'+p2(cs), full:(h?h+':':'')+p2(m)+':'+p2(s)+'.'+p2(cs)};
}
function renderSwTime(){ const f=fmtSw(swNow()); setT($('swMain'),f.main); setT($('swCs'),f.cs) }
function renderSwBtns(){
  $('swStart').disabled=sw.run; $('swStop').disabled=!sw.run; $('swLap').disabled=!sw.run;
  $('swReset').disabled=sw.run || (swNow()===0 && !sw.laps.length);
}
function renderLaps(){
  const ul=$('laps'); ul.textContent='';
  sw.laps.forEach(l=>{
    const li=document.createElement('li');
    const a=document.createElement('b'); a.textContent='Lap '+l.n;
    const b=document.createElement('strong'); b.textContent=fmtSw(l.lap).full;
    const c=document.createElement('span'); c.textContent=fmtSw(l.total).full;
    li.append(a,b,c); ul.appendChild(li);
  });
}
function swLoop(){ renderSwTime(); if(sw.run) sw.raf=requestAnimationFrame(swLoop) }
$('swStart').onclick=()=>{ sw.run=true; sw.start=Date.now(); swLoop(); renderSwBtns() };
$('swStop').onclick=()=>{ sw.base+=Date.now()-sw.start; sw.run=false; cancelAnimationFrame(sw.raf); renderSwTime(); renderSwBtns() };
$('swLap').onclick=()=>{
  const total=swNow(), prev=sw.laps.length?sw.laps[0].total:0;
  sw.laps.unshift({n:sw.laps.length+1, lap:total-prev, total}); renderLaps();
};
$('swReset').onclick=()=>{ sw.base=0; sw.laps=[]; renderSwTime(); renderLaps(); renderSwBtns() };

/* ===== TIMER ===== */
const tm={total:300000,rem:300000,run:false,end:0,iv:0,ringing:false,ringIv:0};
const CIRC=2*Math.PI*108;
let ac;
function ensureAudio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume() }catch(e){} }
function beep(){
  if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
  o.type='sine'; o.frequency.value=880;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.4);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.45);
}
function ring(){
  tm.ringing=true; let n=0;
  const go=()=>{ beep(); if(navigator.vibrate) navigator.vibrate([200,100,200]); if(++n>=40){ stopRing(); renderTm() } };
  go(); tm.ringIv=setInterval(go,800);
}
function stopRing(){ tm.ringing=false; clearInterval(tm.ringIv); if(navigator.vibrate) navigator.vibrate(0) }
function fmtTm(ms){
  const t=Math.ceil(ms/1000), s=t%60, m=Math.floor(t/60)%60, h=Math.floor(t/3600);
  return h ? h+':'+p2(m)+':'+p2(s) : Math.floor(t/60)+':'+p2(s);
}
function renderTm(){
  const txt=fmtTm(tm.rem);
  setT($('tmText'),txt); $('tmText').classList.toggle('long', txt.length>5);
  $('prog').style.strokeDasharray=CIRC;
  $('prog').style.strokeDashoffset=CIRC*(1-(tm.total?tm.rem/tm.total:0));
  $('tmGo').textContent = tm.run ? 'Pause' : (tm.rem>0 && tm.rem<tm.total ? 'Resume' : 'Start');
  $('tmGo').disabled = tm.rem<=0;
  $('tmReset').textContent = tm.ringing ? 'Stop alarm' : 'Reset';
  $('tmUp').textContent = tm.ringing ? 'Time’s up!' : '';
}
function tickTm(){
  if(!tm.run) return;
  tm.rem=Math.max(0,tm.end-Date.now());
  if(tm.rem===0){ tm.run=false; clearInterval(tm.iv); ring() }
  renderTm();
}
function chooseTimer(ms){
  stopRing(); clearInterval(tm.iv); tm.run=false; tm.total=ms; tm.rem=ms;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', parseInt(c.dataset.min)*60000===ms));
  renderTm();
}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>chooseTimer(parseInt(c.dataset.min)*60000));
$('tmSetCustom').onclick=()=>{
  const m=parseInt($('tmCustom').value);
  if(!(m>=1&&m<=600)){ toast('Enter 1 to 600 minutes.'); return }
  chooseTimer(m*60000);
};
$('tmGo').onclick=()=>{
  if(tm.run){ tm.rem=Math.max(0,tm.end-Date.now()); tm.run=false; clearInterval(tm.iv); renderTm(); return }
  if(tm.rem<=0) return;
  ensureAudio(); tm.run=true; tm.end=Date.now()+tm.rem; clearInterval(tm.iv); tm.iv=setInterval(tickTm,200); renderTm();
};
$('tmReset').onclick=()=>{ stopRing(); clearInterval(tm.iv); tm.run=false; tm.rem=tm.total; renderTm() };

/* ===== CALENDAR ===== */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MIN_Y=1900, MAX_Y=2099;
const mkKey=(y,m,d)=>y+'-'+p2(m+1)+'-'+p2(d);
const todayKey=()=>{ const t=new Date(); return mkKey(t.getFullYear(),t.getMonth(),t.getDate()) };
const longDate=k=>{ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) };
const shortDate=k=>{ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}) };
const t0=new Date();
const cal={y:t0.getFullYear(), m:t0.getMonth(), sel:todayKey()};
if(cal.y>MAX_Y){ cal.y=MAX_Y } if(cal.y<MIN_Y){ cal.y=MIN_Y }

MONTHS.forEach((n,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=n; $('cMonth').appendChild(o) });
for(let y=MIN_Y;y<=MAX_Y;y++){ const o=document.createElement('option'); o.value=y; o.textContent=y; $('cYear').appendChild(o) }
['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach((n,i)=>{ const d=document.createElement('div'); d.textContent=n; if(i>=5) d.className='h'; $('dow').appendChild(d) });

function renderCal(){
  $('cMonth').value=cal.m; $('cYear').value=cal.y;
  $('cPrev').disabled = cal.y===MIN_Y && cal.m===0;
  $('cNext').disabled = cal.y===MAX_Y && cal.m===11;
  const box=$('days'), frag=document.createDocumentFragment();
  const first=new Date(cal.y,cal.m,1).getDay(), count=new Date(cal.y,cal.m+1,0).getDate(), tk=todayKey();
  for(let i=0;i<first;i++) frag.appendChild(document.createElement('div'));
  for(let d=1;d<=count;d++){
    const k=mkKey(cal.y,cal.m,d), col=(first+d-1)%7;
    const b=document.createElement('button'); b.type='button';
    b.className='d'+(col>=5?' hol':'')+(k===tk?' today':'')+(k===cal.sel?' sel':'')+(store.notes[k]?' note':'');
    b.setAttribute('aria-label', longDate(k)+(store.notes[k]?', has a reminder':'')+(k===tk?', today':''));
    const n=document.createElement('span'); n.className='n'; n.textContent=d; b.appendChild(n);
    b.onclick=()=>{ cal.sel=k; renderCal(); renderPanel() };
    frag.appendChild(b);
  }
  box.textContent=''; box.appendChild(frag);
}
function renderPanel(){
  const k=cal.sel, note=store.notes[k]||'';
  $('dpTitle').textContent=longDate(k);
  const n=$('dpNote'); n.textContent = note || 'No reminder for this day.'; n.className='dpnote scr'+(note?'':' empty');
}
function openEdit(){
  const note=store.notes[cal.sel]||'';
  $('edTitle').textContent=longDate(cal.sel); $('dpText').value=note; $('dpDel').hidden=!note;
  $('editModal').hidden=false; setTimeout(()=>$('dpText').focus(),40);
}
function closeEdit(){ $('editModal').hidden=true }
$('dpEdit').onclick=openEdit;
$('dpCancel').onclick=closeEdit;
$('editModal').addEventListener('pointerdown',e=>{ if(e.target.id==='editModal') closeEdit() });
$('dpSave').onclick=()=>{
  const v=$('dpText').value.trim();
  if(v) store.notes[cal.sel]=v; else delete store.notes[cal.sel];
  save(); closeEdit(); renderCal(); renderPanel(); refreshSearch(); toast(v?'Reminder saved.':'Reminder removed.');
};
$('dpDel').onclick=async()=>{
  if(await ask('Delete the reminder for '+shortDate(cal.sel)+'?','Delete')){
    delete store.notes[cal.sel]; save(); closeEdit(); renderCal(); renderPanel(); refreshSearch(); toast('Reminder deleted.');
  }
};
$('cPrev').onclick=()=>{ cal.m--; if(cal.m<0){ cal.m=11; cal.y-- } renderCal() };
$('cNext').onclick=()=>{ cal.m++; if(cal.m>11){ cal.m=0; cal.y++ } renderCal() };
$('cMonth').onchange=e=>{ cal.m=parseInt(e.target.value); renderCal() };
$('cYear').onchange=e=>{ cal.y=parseInt(e.target.value); renderCal() };
function goTo(k){
  const [y,m]=k.split('-').map(Number); cal.y=y; cal.m=m-1; cal.sel=k;
  renderCal(); renderPanel();
}
$('cToday').onclick=()=>goTo(todayKey());

/* search: results drop down over the calendar, tap one to jump to that date */
function hideResults(){ $('results').hidden=true }
function runSearch(){
  const q=$('q').value.trim().toLowerCase(), ul=$('results'); ul.textContent='';
  if(!q){ hideResults(); return }
  ul.hidden=false;
  const hits=Object.keys(store.notes).filter(k=>store.notes[k].toLowerCase().includes(q)).sort().slice(0,30);
  if(!hits.length){ const li=document.createElement('li'); li.className='none'; li.textContent='No reminder found.'; ul.appendChild(li); return }
  hits.forEach(k=>{
    const li=document.createElement('li'), b=document.createElement('button'); b.type='button';
    const d=document.createElement('span'); d.className='rd'; d.textContent=shortDate(k);
    const t=document.createElement('span'); t.className='rt'; const txt=store.notes[k].replace(/\s+/g,' '); t.textContent=txt.length>70?txt.slice(0,70)+'…':txt;
    b.append(d,t); b.onclick=()=>{ $('q').value=''; hideResults(); goTo(k) }; li.appendChild(b); ul.appendChild(li);
  });
}
function refreshSearch(){ if(!$('results').hidden) runSearch() }
$('q').oninput=runSearch;
$('q').addEventListener('focus',()=>{ if($('q').value.trim()) runSearch() });
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('.search')) hideResults() });

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!$('modal').hidden) $('mNo').click();
  else if(!$('editModal').hidden) closeEdit();
  else hideResults();
});

/* ===== TABS (Android back button goes to the previous tab) ===== */
const TABS=['clock','stopwatch','timer','calendar'];
function showTab(t){
  document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected', x.dataset.tab===t));
  TABS.forEach(n=>$('tab-'+n).hidden = n!==t);
  hideResults();
  if(t==='calendar'){ renderCal(); renderPanel() }
}
history.replaceState({tab:'clock'},'');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  const t=b.dataset.tab; if(history.state && history.state.tab===t) return;
  history.pushState({tab:t},''); showTab(t);
});
addEventListener('popstate',e=>showTab((e.state&&e.state.tab)||'clock'));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ tickTm(); tickClock(); if(!$('tab-calendar').hidden) renderCal() } });

/* ===== start ===== */
tickClock(); fillAdjust(); renderSwTime(); renderSwBtns(); renderLaps(); renderTm(); renderCal(); renderPanel();

if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
